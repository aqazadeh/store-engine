spring:
  application:
    name: catalog-command-service
    version: 1.0.0-BETA
  mvc:
    apiversion:
      default: 1.0
      supported: 1.0
      use:
        header: X-API-Version

store-engine:
  event:
    handler:
      metrics:
        enabled: false
      logging:
        enabled: false
    dispatcher:
      strategies:
        - name: domain-event
          event: az.kon.academy.event.behavioral.DomainEvent
          strategy: az.kon.academy.event.dispatcher.strategy.InternalEventDispatchStrategy

management:
  endpoints:
    web:
      exposure:
        include: "*"

  metrics:
    enable:
      all: true

logging:
  level:
    az.kon.academy: DEBUG

springdoc:
  swagger-ui:
    path: /swagger
    enabled: true
    default-models-expand-depth: -1
    filter: true
  api-docs:
    enabled: true
    groups:
      enabled: true