name: store-engine

services:
  se-postgres:
    image: postgres:18
    container_name: se-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=200", "-c", "max_replication_slots=4", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./mount/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - store-engine-network
volumes:
  postgres_data: